[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/control",
    "crates/planner",
    "crates/fabric",
    "crates/guest",
    "crates/engines/differential",
    "crates/engines/challenges",
    "crates/engines/mutation",
    "crates/engines/formal",
    "crates/adversary",
    "crates/receipts",
    "crates/reputation",
    "crates/cli",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/LaloNchera22/rebut"

[workspace.dependencies]
verifier-core = { path = "crates/core" }
verifier-planner = { path = "crates/planner" }
verifier-fabric = { path = "crates/fabric" }
verifier-guest = { path = "crates/guest" }
verifier-differential = { path = "crates/engines/differential" }
verifier-challenges = { path = "crates/engines/challenges" }
verifier-mutation = { path = "crates/engines/mutation" }
verifier-formal = { path = "crates/engines/formal" }
verifier-adversary = { path = "crates/adversary" }
verifier-receipts = { path = "crates/receipts" }
verifier-reputation = { path = "crates/reputation" }
verifier-control = { path = "crates/control" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rand_chacha = "0.3"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4", features = ["derive", "env"] }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
tempfile = "3"
# BBS signatures, blind issuance and pseudonyms (IETF CFRG drafts), ADR-8.
# Pinned exactly: a crypto dependency is upgraded on purpose, not by `cargo update`.
zkryptium = { version = "=0.7.1", default-features = false, features = ["bbsplus", "bbsplus_blind", "bbsplus_nym"] }
