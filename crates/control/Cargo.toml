[package]
name = "verifier-control"
description = "Control plane: GitHub webhooks, Postgres job queue, orchestration, receipts and API."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "verifier-control"
path = "src/main.rs"

[dependencies]
verifier-core.workspace = true
verifier-receipts.workspace = true
verifier-planner.workspace = true
verifier-fabric.workspace = true
verifier-differential.workspace = true
verifier-challenges.workspace = true
verifier-mutation.workspace = true
verifier-guest = { path = "../guest", default-features = false }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
time.workspace = true
uuid.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
sqlx = { workspace = true, features = ["macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
jsonwebtoken = "9"
subtle = "2"

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
