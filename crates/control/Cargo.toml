[package]
name = "rebut-control"
description = "Control plane: GitHub webhooks, Postgres job queue, orchestration, receipts and API."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rebut-control"
path = "src/main.rs"

[dependencies]
rebut-core.workspace = true
rebut-receipts.workspace = true
rebut-planner.workspace = true
rebut-fabric.workspace = true
rebut-differential.workspace = true
rebut-challenges.workspace = true
rebut-mutation.workspace = true
rebut-formal.workspace = true
rebut-adversary.workspace = true
rebut-guest = { path = "../guest", version = "0.1.0", default-features = false }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
time.workspace = true
uuid.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
sqlx = { workspace = true, features = ["macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
jsonwebtoken = "9"
subtle = "2"

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
