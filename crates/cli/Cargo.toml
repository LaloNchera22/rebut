[package]
name = "rebut"
description = "Check that a Rust change does what it claims: differential runs against the base branch, seeded challenges, mutation and Kani, all on your machine."
readme = "../../README.md"
keywords = ["testing", "verification", "differential", "fuzzing", "refactor"]
categories = ["development-tools::testing", "command-line-utilities"]
homepage = "https://lalonchera22.github.io/rebut/"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "rebut"
path = "src/main.rs"

[dependencies]
rebut-core.workspace = true
rebut-planner.workspace = true
rebut-fabric.workspace = true
rebut-differential.workspace = true
rebut-challenges.workspace = true
rebut-receipts.workspace = true
rebut-reputation.workspace = true
rebut-guest = { path = "../guest", version = "0.1.0", default-features = false }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tempfile.workspace = true
tar = "0.4"

[dev-dependencies]
sha2.workspace = true
